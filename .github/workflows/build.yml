name: Gerar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # O Android SDK já vem instalado nas máquinas do GitHub (ANDROID_HOME)
      - name: Compilar APK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: MinhaOficina-apk
          path: app/build/outputs/apk/release/*.apk

      # Guarda o APK mais recente no branch "apk" para download direto
      - name: Publicar APK no branch apk
        run: |
          mkdir out
          cp app/build/outputs/apk/release/*.apk out/MinhaOficina.apk
          cd out
          git init -q -b apk
          git add MinhaOficina.apk
          git -c user.name="github-actions" -c user.email="actions@github.com" commit -q -m "APK de ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" apk
